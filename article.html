<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Article — Simpler</title>
  <link rel="stylesheet" href="brand.css">
  <meta name="description" content="Read full articles from Simpler by Ebrahim Gaber — chemical engineering, process design, and machine learning insights.">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- NAV -->
  <nav>
    <div class="container nav-inner">
      <div class="brand">
        <div class="logo">S</div>
        <div>
          <div class="brand-title" data-i18n="brand_title">Simpler</div>
          <div class="brand-subtitle" data-i18n="brand_subtitle">Ebrahim Gaber</div>
        </div>
      </div>

      <div class="nav-links">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="products.html" data-i18n="nav_products">Products</a>
        <a href="about.html" data-i18n="nav_about">About</a>
        <a href="blog.html" class="active" data-i18n="nav_articles">Articles</a>
        <a href="contact.html" data-i18n="nav_contact">Contact</a>
      </div>

      <div class="control-buttons">
        <button id="themeToggle" class="small-btn" title="Toggle theme">🌓</button>
        <button id="langToggle" class="small-btn" title="Toggle language">AR</button>
        <button id="navToggle" class="small-btn nav-toggle" title="Toggle navigation" aria-expanded="false">☰</button>
      </div>
    </div>
  </nav>

  <!-- ARTICLE CONTAINER -->
  <main class="container" style="padding:40px 0;max-width:800px;">
    <div id="articleContent" style="line-height:1.8;font-size:17px;color:var(--color-text)">
      <p class="muted">Loading article...</p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <div style="font-weight:700" data-i18n="footer_rights">Simpler — Ebrahim Gaber</div>
      <div class="muted" style="font-size:13px">© <span id="year"></span></div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const file = params.get('file');
      const container = document.getElementById('articleContent');

      if (!file) {
        container.innerHTML = "<p style='color:red'>No article specified.</p>";
        return;
      }

      try {
        const response = await fetch(file);
        if (!response.ok) throw new Error("Failed to fetch article");
        const markdown = await response.text();
        container.innerHTML = marked.parse(markdown);
      } catch (err) {
        console.error(err);
        container.innerHTML = "<p style='color:red'>Failed to load this article. Please try again later.</p>";
      }
    }

    loadArticle();
  </script>

  <script src="main.js"></script>
</body>
</html>
